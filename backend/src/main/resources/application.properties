spring.application.name=carry-backend

# Server Port
server.port=8080

# Database Configuration (read from environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carry_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection Pool Settings
# Prevents startup crash and long hangs if database is temporarily offline during environment setup
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000
jwt.secret=${JWT_SECRET:this_is_a_default_secret_key_for_local_development_only_do_not_use_in_prod}
cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
