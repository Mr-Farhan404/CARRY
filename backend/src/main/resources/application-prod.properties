spring.application.name=carry-backend

# Server Port (supports PaaS container port allocation)
server.port=${PORT:8080}

# Database Configuration (environment variables ONLY - no defaults or hardcoded secrets)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Verbose SQL logging disabled
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.springframework.jdbc=ERROR

# Flyway Configuration - runs automatically against fresh production database on first boot
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Connection Pool Settings
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JWT Configuration (environment variable ONLY - no default fallback)
jwt.secret=${JWT_SECRET}

# CORS Configuration (exact frontend URL via environment variable ONLY - not localhost, not "*")
cors.allowed-origin=${FRONTEND_URL}
